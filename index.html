<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grade 4 英文聽音拼字大闖關 (1-300)</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            padding: 15px; 
            color: #333; 
            user-select: none;
            -webkit-user-select: none;
        }
        .card { 
            background: white; 
            max-width: 550px; 
            margin: 10px auto; 
            padding: 25px 20px; 
            border-radius: 20px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
        }
        h1 { color: #2c3e50; font-size: 22px; margin-top: 0; }
        
        .select-box {
            margin-bottom: 15px;
            font-size: 16px;
        }
        select {
            padding: 8px 15px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid #3498db;
            background-color: white;
            color: #2c3e50;
            font-weight: bold;
            outline: none;
        }

        .score-bar { font-size: 16px; color: #7f8c8d; margin-bottom: 15px; }
        
        .btn-sound {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(52,152,219,0.3);
            margin-bottom: 15px;
        }
        .btn-sound:active { transform: scale(0.96); }

        .display-box {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 3px;
            min-height: 55px;
            line-height: 55px;
            border-bottom: 3px solid #3498db;
            margin: 10px auto 20px;
            width: 90%;
            color: #2c3e50;
            background-color: #fafafa;
            border-radius: 8px 8px 0 0;
            word-break: break-all;
        }

        .bubble-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            min-height: 120px;
            align-items: center;
        }

        .bubble {
            color: white;
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, opacity 0.2s;
        }
        .bubble:active { transform: scale(0.85); }
        .bubble.space-bubble {
            width: 85px;
            border-radius: 28px;
            font-size: 16px;
            background-color: #f39c12 !important;
        }
        .bubble.used {
            opacity: 0.15;
            pointer-events: none;
            transform: scale(0.75);
            box-shadow: none;
        }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .btn-action {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-back { background-color: #e74c3c; }
        .btn-clear { background-color: #95a5a6; }

        #result {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
            min-height: 35px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎧 聽音選字母拼字大闖關</h1>
        
        <div class="select-box">
            <label for="groupSelect"><b>選擇關卡：</b></label>
            <select id="groupSelect" onchange="changeGroup()">
                <option value="1">第 1 ~ 25 題</option>
                <option value="2">第 26 ~ 50 題</option>
                <option value="3" selected>第 51 ~ 75 題</option>
                <option value="4">第 76 ~ 100 題</option>
                <option value="5">第 101 ~ 125 題</option>
                <option value="6">第 126 ~ 150 題</option>
                <option value="7">第 151 ~ 175 題</option>
                <option value="8">第 176 ~ 200 題</option>
                <option value="9">第 201 ~ 225 題</option>
                <option value="10">第 226 ~ 250 題</option>
                <option value="11">第 251 ~ 275 題</option>
                <option value="12">第 276 ~ 300 題</option>
            </select>
        </div>

        <div class="score-bar">第 <span id="current">1</span> / <span id="total">25</span> 題</div>
        
        <button class="btn-sound" onclick="playAudio()">🔊 聽發音</button>
        
        <div class="display-box" id="display"></div>

        <div class="bubble-container" id="bubbleArea"></div>

        <div class="action-btns">
            <button class="btn-action btn-back" onclick="backspace()">⌫ 刪除</button>
            <button class="btn-action btn-clear" onclick="clearAll()">🔄 重設</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        const allGroups = {
            "1": ["clothes", "umbrella", "sandwich", "milk", "relationship", "artificial", "intelligence", "refrigerator", "confidence", "grammar", "illustration", "expository", "realistic", "fiction", "character", "element", "text feature", "quotation mark", "event", "specific", "example", "narrator", "author", "prediction", "problem"],
            "2": ["solution", "cause", "effect", "idiom", "synonym", "antonym", "grasshopper", "surprise", "reunion", "adaptation", "sequence", "compare", "contrast", "heading", "diagram", "ancestor", "descendant", "honor", "respect", "despise", "dislike", "irritation", "annoying", "endurance", "strength"],
            "3": ["retreat", "pull back", "intensity", "energy", "forfeit", "wrongdoing", "alter", "change", "collapse", "fall", "crisis", "emergency", "destruction", "destroy", "hazard", "danger", "severe", "strong", "substantial", "a lot", "unpredictable", "surprised", "bouquet", "flower", "emotion"],
            "4": ["feeling", "encircle", "surround", "express", "show", "fussy", "picky", "portrait", "likeness", "sparkle", "twinkle", "whirl", "spin", "camouflage", "blend", "dribble", "trickle", "extraordinary", "unusual", "poisonous", "jeopardy", "pounce", "down", "predator", "hunt"],
            "5": ["prey", "victim", "vibration", "movement", "accelerate", "increase", "advantage", "benefit", "capability", "ability", "friction", "resistance", "gravity", "downward", "identity", "personal", "inquiry", "search", "thrilling", "exciting", "annoyed", "bother", "attitude", "mindset", "commotion"],
            "6": ["noise", "cranky", "grumpy", "familiar", "usual", "frustrated", "calendar", "selfish", "not sharing", "specialty", "talent", "archaeology", "excavation", "document", "record", "era", "epoch", "evidence", "confirmation", "expedition", "voyage", "permanent", "forever", "tremendous", "enormous"],
            "7": ["uncover", "expose", "accountable", "responsible", "advise", "suggest", "desperately", "hopeless", "hesitate", "pause", "humiliate", "ashamed", "inspiration", "excite", "self-esteem", "confident", "uncomfortably", "unpleasant", "cling", "stick", "dissolve", "liquid", "gritty", "texture", "humid"],
            "8": ["weather", "magnify", "enlarge", "microscope", "tool", "mingle", "socialize", "typical", "normal", "settle", "settlement", "prospector", "mineral", "withered", "dried up", "topple", "unsteady", "plunge", "drop", "shrivel", "wrinkled", "scoff", "mock", "territory", "claimed area"],
            "9": ["capable", "creative", "generous", "honest", "humble", "motivated", "polite", "esteem", "liable", "trustworthy", "power", "speed", "erosion", "battery", "butte", "canyon", "collision", "conductor", "crest", "drought", "flood", "fossil", "fault", "frequency", "gill"],
            "10": ["heart", "threat", "hydropower", "insulator", "kidney", "landslide", "legend", "lung", "muscle", "organ", "petroleum", "reflect", "resistor", "skeleton", "skin", "sound", "stomach", "system", "tissue", "trough", "tsunami", "volcano", "wave", "wildfire", "absorb"],
            "11": ["appear", "available", "avalanche", "brain", "coal", "device", "earthquake", "typhoon", "extinct", "generator", "heat", "light", "outcome", "pollutant", "potential", "respond", "sample", "sedimentary", "simulate", "structure", "trench", "transverse", "turbine", "weathering", "deposition"],
            "12": ["amplitude", "connect", "electric", "eruption", "digital", "horizontal", "function", "receiver", "primary", "sepal", "classify", "emission", "extend", "feature", "impact", "liver", "pattern", "radiation", "ray", "refract", "symbol", "transfer", "transmitter", "uranium", "wavelength"]
        };

        let currentGroupKey = "3";
        let wordList = allGroups[currentGroupKey];
        let currentIndex = 0;
        let currentTyped = "";
        let bubbleData = [];

        function changeGroup() {
            currentGroupKey = document.getElementById("groupSelect").value;
            wordList = allGroups[currentGroupKey];
            currentIndex = 0;
            initWord();
        }

        function initWord() {
            currentTyped = "";
            document.getElementById('display').innerText = "";
            document.getElementById('result').innerText = "";
            document.getElementById('current').innerText = currentIndex + 1;
            document.getElementById('total').innerText = wordList.length;

            const targetWord = wordList[currentIndex];
            let chars = targetWord.split('');

            // 洗牌字母順序
            for (let i = chars.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }

            bubbleData = chars.map((char, index) => ({
                id: index,
                char: char,
                used: false
            }));

            renderBubbles();
            playAudio();
        }

        function renderBubbles() {
            const container = document.getElementById('bubbleArea');
            container.innerHTML = '';

            const colors = ['#e74c3c', '#e67e22', '#2ecc71', '#1abc9c', '#3498db', '#9b59b6'];

            bubbleData.forEach((item, index) => {
                const btn = document.createElement('button');
                const isSpace = item.char === ' ';
                btn.className = 'bubble' + (isSpace ? ' space-bubble' : '') + (item.used ? ' used' : '');
                btn.innerText = isSpace ? '空白' : item.char;
                btn.style.backgroundColor = colors[index % colors.length];
                btn.onclick = () => selectBubble(index);
                container.appendChild(btn);
            });
        }

        function selectBubble(index) {
            if (bubbleData[index].used) return;
            bubbleData[index].used = true;
            currentTyped += bubbleData[index].char;
            updateDisplay();
            renderBubbles();

            // 拼完自動檢查
            if (currentTyped.length === wordList[currentIndex].length) {
                checkAnswer();
            }
        }

        function backspace() {
            if (currentTyped.length === 0) return;
            const lastChar = currentTyped[currentTyped.length - 1];
            currentTyped = currentTyped.slice(0, -1);

            for (let i = bubbleData.length - 1; i >= 0; i--) {
                if (bubbleData[i].used && bubbleData[i].char === lastChar) {
                    bubbleData[i].used = false;
                    break;
                }
            }
            document.getElementById('result').innerText = "";
            updateDisplay();
            renderBubbles();
        }

        function clearAll() {
            currentTyped = "";
            bubbleData.forEach(item => item.used = false);
            document.getElementById('result').innerText = "";
            updateDisplay();
            renderBubbles();
        }

        function updateDisplay() {
            document.getElementById('display').innerText = currentTyped;
        }

        function playAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const text = wordList[currentIndex];
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        function checkAnswer() {
            const resultDiv = document.getElementById('result');
            const target = wordList[currentIndex];

            if (currentTyped.toLowerCase() === target.toLowerCase()) {
                resultDiv.style.color = '#2ecc71';
                resultDiv.innerText = "🎉 答對了！太棒了！";
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % wordList.length;
                    initWord();
                }, 1200);
            } else {
                resultDiv.style.color = '#e74c3c';
                resultDiv.innerText = "❌ 拼錯囉，請再試試看！";
            }
        }

        initWord();
    </script>
</body>
</html>
