<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字聽音拼字遊戲 (51-75)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; color: #333; }
        .card { background: white; max-width: 500px; margin: 20px auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 22px; }
        .btn { background-color: #3498db; color: white; border: none; padding: 12px 24px; font-size: 18px; border-radius: 8px; cursor: pointer; margin: 10px 5px; }
        .btn:active { background-color: #2980b9; }
        input[type="text"] { font-size: 20px; padding: 10px; width: 80%; border: 2px solid #ccc; border-radius: 8px; text-align: center; margin-top: 15px; }
        #result { margin-top: 15px; font-size: 20px; font-weight: bold; min-height: 30px; }
        #score { font-size: 18px; color: #7f8c8d; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>單字聽音拼字練習 (51 - 75)</h1>
        <div id="score">題號：<span id="current">1</span> / <span id="total">25</span></div>
        <button class="btn" onclick="playAudio()">🔊 聽發音</button>
        <br>
        <input type="text" id="userInput" placeholder="請輸入英文單字" autocomplete="off" autocorrect="off" autocapitalize="none">
        <br>
        <button class="btn" style="background-color: #2ecc71;" onclick="checkAnswer()">送出答案</button>
        <div id="result"></div>
    </div>

    <script>
        const wordList = [
            "retreat", "pull back", "intensity", "energy", "forfeit",
            "wrongdoing", "alter", "change", "collapse", "fall",
            "crisis", "emergency", "destruction", "destroy", "hazard",
            "danger", "severe", "strong", "substantial", "a lot",
            "unpredictable", "surprised", "bouquet", "flower", "emotion"
        ];

        let currentIndex = 0;

        function updateProgress() {
            document.getElementById('current').innerText = currentIndex + 1;
            document.getElementById('total').innerText = wordList.length;
        }

        function playAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const text = wordList[currentIndex];
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("您的瀏覽器不支援發音功能");
            }
        }

        function checkAnswer() {
            const input = document.getElementById('userInput').value.trim().toLowerCase();
            const correct = wordList[currentIndex].toLowerCase();
            const resultDiv = document.getElementById('result');

            if (input === correct) {
                resultDiv.style.color = '#2ecc71';
                resultDiv.innerText = "🎉 答對了！";
                setTimeout(() => {
                    resultDiv.innerText = "";
                    document.getElementById('userInput').value = "";
                    currentIndex = (currentIndex + 1) % wordList.length;
                    updateProgress();
                }, 1000);
            } else {
                resultDiv.style.color = '#e74c3c';
                resultDiv.innerText = "❌ 答錯囉，再試一次！";
            }
        }

        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        updateProgress();
    </script>
</body>
</html>
