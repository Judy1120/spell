<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聽音拼字小勇者 🎧 Grade 4 Spelling</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;

      --card-bg: #ffffff;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; padding: 20px; background-color: var(--bg); color: #1e293b; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .container { width: 100%; max-width: 650px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    h1 { color: #312e81; margin: 0 0 15px 0; font-size: 1.8rem; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 12px 18px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; }
    select { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.95rem; font-weight: 600; color: #334155; }

    .audio-section { margin: 20px 0; }
    .btn-audio { background: #e0e7ff; color: var(--primary-dark); border: 2px solid var(--primary); padding: 15px 25px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: all 0.2s; margin: 5px; }
    .btn-audio:hover { transform: scale(1.05); background: var(--primary); color: white; }
    .btn-audio.slow { background: #fef3c7; color: #b45309; border-color: #f59e0b; }

    .word-slots { display: flex; justify-content: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; min-height: 50px; }
    .slot { width: 40px; height: 50px; border-bottom: 3px solid #64748b; font-size: 1.8rem; font-weight: bold; display: flex; align-items: center; justify-content: center; color: #1e1b4b; text-transform: lowercase; }

    .input-box { width: 80%; font-size: 1.5rem; padding: 10px; text-align: center; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; margin-bottom: 15px; letter-spacing: 2px; }
    .input-box:focus { border-color: var(--primary); }

    .bubbles { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 15px 0; }
    .bubble { background: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 12px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: bold; cursor: pointer; user-select: none; }
    .bubble:hover { background: #e2e8f0; }
    .bubble.used { opacity: 0.3; pointer-events: none; }

    .hint-box { background: #f1f5f9; padding: 10px 15px; border-radius: 8px; font-size: 0.95rem; color: #475569; margin: 10px 0; display: none; }
    
    .action-btns { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
    button.main-btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    button.main-btn:hover { background: var(--primary-dark); }
    button.sub-btn { background: #94a3b8; color: white; border: none; padding: 12px 18px; border-radius: 10px; font-size: 0.9rem; cursor: pointer; }

    .status-msg { font-size: 1.2rem; font-weight: bold; margin-top: 15px; min-height: 1.8rem; }
    .lives { color: var(--danger); font-size: 1.2rem; }
    .score { color: var(--accent); }
  </style>
</head>
<body>

<div class="container">
  <h1>🎧 聽音拼字小勇者</h1>

  <div class="top-bar">
    <div>
      <label>關卡：</label>
      <select id="group-select" onchange="changeGroup()"></select>
    </div>
    <div class="lives" id="lives-display">❤️❤️❤️</div>
    <div class="score" id="score-display">⭐ 得分: 0</div>
  </div>

  <div class="audio-section">
    <button class="btn-audio" onclick="playAudio(1.0)">🔊 聽正常發音</button>
    <button class="btn-audio slow" onclick="playAudio(0.6)">🐢 慢速發音</button>
  </div>

  <div class="hint-box" id="hint-display"></div>

  <!-- 單字字數底線 -->
  <div class="word-slots" id="word-slots"></div>

  <!-- 鍵盤輸入框 -->
  <input type="text" id="user-input" class="input-box" placeholder="點此輸入拼字..." autocomplete="off" oninput="syncInputWithSlots()" onkeyup="if(event.key==='Enter') checkAnswer()">

  <!-- 字母氣泡選擇區 -->
  <div class="bubbles" id="bubbles-container"></div>

  <div class="action-btns">
    <button class="sub-btn" onclick="toggleHint()">💡 看中文提示</button>
    <button class="sub-btn" onclick="clearInput()">🧹 清除重新拼</button>
    <button class="main-btn" onclick="checkAnswer()">🚀 檢查答案</button>
  </div>

  <div class="status-msg" id="status-msg"></div>
</div>

  };

  let currentList = [];
  let currentIndex = 0;
  let currentWordObj = null;
  let score = 0;
  let lives = 3;

  // 初始化選單
  const select = document.getElementById("group-select");
  Object.keys(ALL_WORDS).forEach(key => {
    let opt = document.createElement("option");
    opt.value = key;
    opt.textContent = `第 ${key} 單字`;
    select.appendChild(opt);
  });

  function changeGroup() {
    const key = select.value;
    currentList = ALL_WORDS[key].sort(() => Math.random() - 0.5);
    currentIndex = 0;
    score = 0;
    updateScore();
    loadNextWord();
  }

  function loadNextWord() {
    if (currentIndex >= currentList.length) {
      document.getElementById("status-msg").innerHTML = "🎉 太棒了！您已完成本組所有單字聽寫！";
      return;
    }
    lives = 3;
    updateLives();
    currentWordObj = currentList[currentIndex];
    document.getElementById("user-input").value = "";
    document.getElementById("status-msg").textContent = "";
    document.getElementById("hint-display").style.display = "none";
    document.getElementById("hint-display").textContent = `中文提示：${currentWordObj.zh}`;

    renderSlots();
    renderBubbles();
    playAudio(1.0);
  }

  function playAudio(rate = 1.0) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(currentWordObj.en);
    utterance.lang = "en-US";
    utterance.rate = rate;
    window.speechSynthesis.speak(utterance);
  }

  function renderSlots() {
    const container = document.getElementById("word-slots");
    container.innerHTML = "";
    const len = currentWordObj.en.length;
    for (let i = 0; i < len; i++) {
      let slot = document.createElement("div");
      slot.className = "slot";
      if (currentWordObj.en[i] === " ") {
        slot.style.border = "none";
        slot.textContent = " ";
      } else {
        slot.id = `slot-${i}`;
      }
      container.appendChild(slot);
    }
  }

  function renderBubbles() {
    const container = document.getElementById("bubbles-container");
    container.innerHTML = "";
    // 將字母打亂並加入隨機干擾字母
    let letters = currentWordObj.en.replace(/\s+/g, '').toLowerCase().split('');
    const extraLetters = "abcdefghijklmnopqrstuvwxyz";
    while (letters.length < Math.max(letters.length + 2, 8)) {
      letters.push(extraLetters[Math.floor(Math.random() * 26)]);
    }
    letters.sort(() => Math.random() - 0.5);

    letters.forEach((char) => {
      let b = document.createElement("div");
      b.className = "bubble";
      b.textContent = char;
      b.onclick = () => {
        const input = document.getElementById("user-input");
        input.value += char;
        syncInputWithSlots();
        b.classList.add("used");
      };
      container.appendChild(b);
    });
  }

  function syncInputWithSlots() {
    const val = document.getElementById("user-input").value.toLowerCase();
    const len = currentWordObj.en.length;
    let valIdx = 0;
    
    for (let i = 0; i < len; i++) {
      const slot = document.getElementById(`slot-${i}`);
      if (!slot) continue; // 空格
      if (valIdx < val.length) {
        slot.textContent = val[valIdx];
        valIdx++;
      } else {
        slot.textContent = "";
      }
    }
  }

  function clearInput() {
    document.getElementById("user-input").value = "";
    syncInputWithSlots();
    document.querySelectorAll(".bubble").forEach(b => b.classList.remove("used"));
  }

  function checkAnswer() {
    const userVal = document.getElementById("user-input").value.trim().toLowerCase();
    const target = currentWordObj.en.toLowerCase();
    const msg = document.getElementById("status-msg");

    if (userVal === target) {
      msg.style.color = "var(--success)";
      msg.textContent = "✨ 太厲害了！拼寫完全正確！";
      score += 10;
      updateScore();
      playAudio(1.0);
      setTimeout(() => {
        currentIndex++;
        loadNextWord();
      }, 1200);
    } else {
      lives--;
      updateLives();
      msg.style.color = "var(--danger)";
      if (lives > 0) {
        msg.textContent = `❌ 拼錯囉，再聽一次試試看！（剩餘心血：${lives}）`;
        playAudio(0.8);
      } else {
        msg.textContent = `💔 挑戰失敗，正確答案是：${currentWordObj.en}`;
        setTimeout(() => {
          currentIndex++;
          loadNextWord();
        }, 2200);
      }
    }
  }

  function toggleHint() {
    const hint = document.getElementById("hint-display");
    hint.style.display = hint.style.display === "none" ? "block" : "none";
  }

  function updateLives() {
    document.getElementById("lives-display").textContent = "❤️".repeat(lives);
  }

  function updateScore() {
    document.getElementById("score-display").textContent = `⭐ 得分: ${score}`;
  }

  // 初始化
  changeGroup();
</script>
